name: ETL Pipeline

on:
  # 2026-08-03 FINAL FREEZE: schedule disabled to preserve data snapshot for final model
  # schedule:
  #   # Every 30 minutes
  #   - cron: "5,35 * * * *"
  workflow_dispatch:

# Prevent overlapping runs from cancelling each other
concurrency:
  group: etl-pipeline
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install psycopg2-binary requests pandas pyproj

      - name: Run ETL cycle
        id: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python etl_cloud.py

      - name: Health check — verify recent data
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, psycopg2, sys
          url = os.getenv('DATABASE_URL')
          url = url.replace('&channel_binding=require', '').replace('?channel_binding=require&', '?').replace('?channel_binding=require', '')
          conn = psycopg2.connect(url)
          cur = conn.cursor()
          cur.execute(\"SELECT MAX(timestamp) FROM availability_logs\")
          latest = cur.fetchone()[0]
          cur.execute(\"SELECT COUNT(*) FROM availability_logs WHERE timestamp >= now() - INTERVAL '2 hours'\")
          recent = cur.fetchone()[0]
          cur.execute(\"SELECT COUNT(DISTINCT carpark_id) FROM availability_logs WHERE timestamp >= now() - INTERVAL '2 hours'\")
          unique_cps = cur.fetchone()[0]
          cur.close()
          conn.close()
          print(f'Latest record: {latest}')
          print(f'Records in last 2h: {recent}')
          print(f'Unique carparks in last 2h: {unique_cps}')
          if unique_cps < 500:
              print(f'WARNING: Only {unique_cps} carparks in last 2 hours (expected ~2000)')
              sys.exit(1)
          else:
              print('Health check PASSED')
          "
